apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dnull-web

resources:
  - deploy/deployment.yaml
  - deploy/service.yaml
  - deploy/ingress.yaml

configMapGenerator:
  - name: site
    files:
      - index.html
      - 404.html
      - deploy/default.conf

labels:
  - pairs:
      app.kubernetes.io/name: dnull-web
    includeSelectors: true
