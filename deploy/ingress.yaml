apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dnull-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dnull.systems
      secretName: dnull-systems-tls
  rules:
    - host: dnull.systems
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dnull-web
                port:
                  number: 80
